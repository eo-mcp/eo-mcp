[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eo-mcp"
version = "0.1.0"
description = "The Open Source Model Context Protocol (MCP) for Planetary Earth Observation"
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "M. Anwar Sounny-Slitine, PhD", email = "anwar@geographerscraft.com" }
]
requires-python = ">=3.10"
keywords = [
    "mcp",
    "model-context-protocol",
    "earth-observation",
    "satellite",
    "remote-sensing",
    "copernicus",
    "landsat",
    "sentinel",
    "stac",
    "agentic-ai",
    "rasterio",
    "geospatial"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
    "mcp>=1.3.0,<2.0.0",
    "pystac-client>=0.8.0",
    "rasterio>=1.3.10",
    "numpy>=1.26.0",
    "shapely>=2.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "rich>=13.7.0",
    "pillow>=10.2.0",
    "scipy>=1.11.0"
]

[project.optional-dependencies]
gee = [
    "earthengine-api>=0.1.390"
]
analysis = [
    "xarray>=2024.1.0",
    "rioxarray>=0.15.0",
    "geopandas>=0.14.0",
    "matplotlib>=3.8.0"
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0"
]

[project.scripts]
eo-mcp = "eo_mcp.cli:app"

[project.urls]
Homepage = "https://eo-mcp.github.io"
Repository = "https://github.com/eo-mcp/eo-mcp"
Documentation = "https://github.com/eo-mcp/eo-mcp#readme"
Issues = "https://github.com/eo-mcp/eo-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/eo_mcp"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["src"]
